async function executeShajraSearch() {
const query = document.getElementById("shajraSearchInput").value.trim();
const branchId = document.getElementById("branchFilter").value;
const statusEl = document.getElementById("searchStatus");
const resultsEl = document.getElementById("searchResults");
if (query.length < 3 && !branchId) {
statusEl.textContent = "Please enter at least 3 letters to search the canonical archive.";
resultsEl.innerHTML = "";
return;
}
statusEl.textContent = "Searching canonical archive via public_people_view...";
try {
// Exact columns: full_name, person_code, father_name, grandfather_name, branch_name, source_book, source_page
let filter = select=*&order=id.asc&limit=40;
if (query.length >= 3) {
const q = encodeURIComponent(query);
filter += &or=(full_name.ilike.*${q}*,person_code.ilike.*${q}*,father_name.ilike.*${q}*);
}
if (branchId) {
filter += &branch_id=eq.${encodeURIComponent(branchId)};
}
const data = await sbFetch(public_people_view?${filter});
cachedPeople = data || [];
if (cachedPeople.length === 0) {
statusEl.textContent = No canonical records matched "${query}".;
resultsEl.innerHTML = "";
return;
}
statusEl.textContent = Showing ${cachedPeople.length} canonical book-verified record(s) (Phone, Email & Home Address hidden):;
renderPersonCards(cachedPeople);
} catch (err) {
statusEl.textContent = Search notice: ${err.message};
}
}

function findQiblaDirection() {
const out = document.getElementById("qiblaResult");
if (!navigator.geolocation) {
out.textContent = "Geolocation is not supported by your browser.";
return;
}
out.textContent = "Acquiring GPS coordinates...";
navigator.geolocation.getCurrentPosition(
pos => {
const lat1 = pos.coords.latitude * Math.PI / 180;
const lon1 = pos.coords.longitude * Math.PI / 180;
const lat2 = 21.4225 * Math.PI / 180;
const lon2 = 39.8262 * Math.PI / 180;
const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
let brng = Math.atan2(y, x) * 180 / Math.PI;
brng = (brng + 360) % 360;
out.innerHTML = Qibla Bearing: <span style="color:var(--emerald); font-size:1.2rem;">${brng.toFixed(1)}°</span> from True North;
},
() => {
out.textContent = "Location permission denied. Please enable GPS to compute Qibla angle.";
}
);
}

function setLanguage(lang) {
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
["en", "ur", "hi"].forEach(l => {
document.getElementById(btn-${l}).classList.toggle("active", l === lang);
});
const dict = i18nStrings[lang] || i18nStrings.en;
document.querySelectorAll("[data-i18n]").forEach(el => {
const key = el.getAttribute("data-i18n");
if (dict[key]) el.textContent = dict[key];
});
}

function openTab(tabId) {
document.querySelectorAll(".tab-section").forEach(sec => sec.classList.remove("active"));
document.querySelectorAll(".nav-tab").forEach(btn => btn.classList.remove("active"));
const target = document.getElementById(tabId);
if (target) target.classList.add("active");
const matchingBtn = Array.from(document.querySelectorAll(".nav-tab")).find(b => b.getAttribute("onclick")?.includes(tabId));
if (matchingBtn) matchingBtn.classList.add("active");
if (tabId === "matrimonyTab") loadMatrimonyProfiles();
}
function escapeHtml(str) {
if (str === null || str === undefined || str === "NULL" || str === "null") return "";
return String(str).replace(/[&<>"']/g, m => ({
"&": "&", "<": "<", ">": ">", '"': """, "'": "'"
}[m]));
}

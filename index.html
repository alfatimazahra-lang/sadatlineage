<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#043927" />
  <title>Sadat Lineage — Global Canonical Sadat Genealogy Archive & Shia Portal</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --emerald-dark: #02261a;
      --emerald: #043927;
      --emerald-mid: #08543a;
      --emerald-light: #0f7653;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa851a;
      --cream: #faf8f2;
      --white: #ffffff;
      --text-dark: #14241e;
      --text-muted: #52665e;
      --danger: #9e2a2b;
      --border: #dcd4bc;
      --shadow: 0 6px 20px rgba(4, 57, 39, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Nastaliq Urdu", "Noto Sans Devanagari", sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      line-height: 1.6;
    }
    [dir="rtl"] { text-align: right; }

    header {
      background: linear-gradient(135deg, var(--emerald-dark), var(--emerald));
      color: var(--white);
      border-bottom: 3px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow);
    }
    .top-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.65rem; }
    .brand-crest {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-light), var(--gold));
      color: var(--emerald-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.25rem;
      border: 2px solid var(--white);
    }
    .brand h1 { font-size: 1.25rem; color: var(--gold); letter-spacing: 0.5px; }
    .brand small { display: block; font-size: 0.75rem; color: var(--gold-light); }

    .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .lang-switcher button.active { background: var(--gold); color: var(--emerald-dark); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--emerald-dark);
      border: none;
      padding: 0.48rem 0.95rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-emerald {
      background: var(--emerald);
      color: var(--gold-light);
      border: 1px solid var(--gold);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-gold:hover, .btn-emerald:hover { opacity: 0.92; }

    nav.main-nav {
      background: var(--emerald-dark);
      overflow-x: auto;
      white-space: nowrap;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
    }
    .nav-container { max-width: 1280px; margin: 0 auto; display: flex; padding: 0 0.5rem; }
    .nav-tab {
      background: none;
      border: none;
      color: #d8e6e0;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }
    .nav-tab:hover { color: var(--gold); }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
      background: rgba(212, 175, 55, 0.08);
    }

    .ad-banner { max-width: 1280px; margin: 0.75rem auto 0; padding: 0 1rem; }
    .ad-box {
      background: linear-gradient(90deg, #06442f, #0b5d41, #06442f);
      border: 1px dashed var(--gold);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.88rem;
    }
    .ad-badge {
      background: var(--gold);
      color: var(--emerald-dark);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    main { max-width: 1280px; margin: 1.25rem auto; padding: 0 1rem 3rem; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 4px solid var(--emerald);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }
    .card-gold { border-top-color: var(--gold); }
    .section-title {
      color: var(--emerald);
      font-size: 1.3rem;
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }

    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.3rem; color: var(--emerald-dark); }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #bfcbb8;
      border-radius: 6px;
      font-size: 0.92rem;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 0 2px rgba(4, 57, 39, 0.15);
    }

    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .search-bar input { flex: 1; min-width: 240px; }
    .person-card {
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      padding: 0.95rem;
      background: #fdfcf9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-right: 4px;
    }
    .badge-verified { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-daughter { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge-paid { background: var(--gold-light); color: var(--emerald-dark); border: 1px solid var(--gold); }
    .badge-code { background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; }

    .bio-box-en {
      background: #f4f8f6;
      border-left: 3px solid var(--emerald);
      padding: 0.65rem 0.85rem;
      border-radius: 5px;
      font-size: 0.88rem;
      margin-top: 0.5rem;
    }
    .bio-box-ur {
      background: #fcf9ef;
      border-right: 3px solid var(--gold);
      padding: 0.75rem 0.95rem;
      border-radius: 5px;
      font-size: 1.02rem;
      line-height: 1.9;
      margin-top: 0.5rem;
      direction: rtl;
      text-align: right;
    }

    .tree-chain {
      border-left: 3px solid var(--gold);
      margin: 1rem 0 1rem 0.75rem;
      padding-left: 1rem;
      max-height: 560px;
      overflow-y: auto;
    }
    .tree-node {
      position: relative;
      padding: 0.55rem 0.8rem;
      margin-bottom: 0.5rem;
      background: #f4f7f5;
      border-radius: 6px;
      border: 1px solid #d5e0da;
    }
    .tree-node.active-root {
      background: #fef9e7;
      border: 2px solid var(--gold);
    }
    .tree-node::before {
      content: "";
      position: absolute;
      left: -1.15rem;
      top: 50%;
      width: 1rem;
      height: 2px;
      background: var(--gold);
    }

    .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
    .month-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      text-align: center;
      cursor: pointer;
      background: var(--white);
      transition: 0.2s;
    }
    .month-card:hover, .month-card.active {
      background: var(--emerald);
      color: var(--gold-light);
      border-color: var(--gold);
    }

    .tasbeeh-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--emerald-mid), var(--emerald-dark));
      border: 5px solid var(--gold);
      color: var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1rem auto;
      cursor: pointer;
      user-select: none;
      box-shadow: var(--shadow);
    }
    .tasbeeh-count { font-size: 2.8rem; font-weight: 800; }

    .governance-note {
      background: #f0f7f4;
      border-left: 4px solid var(--emerald);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    @media print {
      body * { visibility: hidden; }
      #certificatePrintArea, #certificatePrintArea * { visibility: visible; }
      #certificatePrintArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: 8px double #043927 !important;
        padding: 2rem !important;
        background: #fffdf7 !important;
      }
    }

    footer {
      background: var(--emerald-dark);
      color: #cbd5e1;
      border-top: 3px solid var(--gold);
      padding: 2rem 1rem;
      font-size: 0.85rem;
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
flex-wrap: wrap;
justify-content: space-between;
gap: 1.5rem;
}
.footer-links button {
background: none;
border: none;
color: var(--gold-light);
cursor: pointer;
margin-right: 1rem;
text-decoration: underline;
font-size: 0.85rem;
}
